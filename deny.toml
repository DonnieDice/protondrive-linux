[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained; pulled in transitively by tauri macros.
  { id = "RUSTSEC-2024-0370" },
  # gtk-rs GTK3 bindings are no longer maintained upstream; required
  # transitively by tauri/webkit2gtk on Linux — no upgrade path until
  # tauri moves to GTK4.
  { id = "RUSTSEC-2024-0411" },
  { id = "RUSTSEC-2024-0412" },
  { id = "RUSTSEC-2024-0413" },
  { id = "RUSTSEC-2024-0414" },
  { id = "RUSTSEC-2024-0415" },
  { id = "RUSTSEC-2024-0416" },
  { id = "RUSTSEC-2024-0417" },
  { id = "RUSTSEC-2024-0418" },
  { id = "RUSTSEC-2024-0419" },
  { id = "RUSTSEC-2024-0420" },
  # unic-* crates are unmaintained; pulled in transitively.
  { id = "RUSTSEC-2025-0075" },
  { id = "RUSTSEC-2025-0080" },
  { id = "RUSTSEC-2025-0081" },
  { id = "RUSTSEC-2025-0098" },
  { id = "RUSTSEC-2025-0100" },
  # quick-xml 0.37.5, pulled in transitively (Windows-only) via
  # tauri-winrt-notification 0.7.2 <- notify-rust 4.17.0. The fix landed in
  # tauri-winrt-notification 0.8.0, which dropped quick-xml entirely, but
  # notify-rust's latest release (4.18.0) still pins tauri-winrt-notification
  # to "^0.7" so there's no upstream path to it yet. Not attacker-reachable
  # here: this path only builds local toast-notification XML from
  # in-process strings, never parses untrusted/network XML.
  { id = "RUSTSEC-2026-0194" },
  { id = "RUSTSEC-2026-0195" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
