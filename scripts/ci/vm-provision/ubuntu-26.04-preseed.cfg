#cloud-config
# scripts/ci/vm-provision/ubuntu-26.04-preseed.cfg
#
# Subiquity autoinstall user-data for the Ubuntu 26.04 headless install into
# the ubuntu2604 guest on the tower hypervisor (issue #20, parent #8).
#
# Loaded by the Subiquity installer via the kernel cmdline:
#   autoinstall ds=nocloud-net;s=http://192.168.1.31:<port>/
# Cloud-init's NoCloud datasource fetches <seed>/user-data + <seed>/meta-data;
# Subiquity then reads the `autoinstall` key from that user-data. The ds=
# argument MUST NOT be quoted on the kernel command line - libvirt passes the
# XML cmdline verbatim, so quotes become literal characters and the datasource
# key never matches (job 58203: the live session booted straight to GDM with
# /proc/cmdline showing "ds=nocloud-net;..." with literal quotes).
#
# Target spec (issue #20 acceptance criteria):
#   - Ubuntu 26.04 installed to the ubuntu2604 guest's qcow2 disk
#   - static 192.168.1.168/24 on br0 (tests/robot/vars/vms.py ubuntu-26.04)
#   - sshd enabled and running
#   - qemu-guest-agent installed and enabled
#   - the Hermes (workforce) public key authorized for login (password login
#     disabled; root SSH limited to key-based login via the late commands)
#   - serial console getty for headless maintenance
#
# Schema note (job 58203 root cause #3): the Subiquity autoinstall JSON
# schema (additionalProperties:false on identity) does NOT accept an
# identity.ssh_key, and `root` is a reserved username, and identity.password
# must be a crypted string acceptable to passwd(1) - "!" fails. SSH keys are
# configured through the autoinstall `ssh` section (install-server +
# authorized-keys + allow-pw:false), which is the schema-supported path.
# The driver (install.sh) injects the workforce public key into the
# ssh.authorized-keys placeholder below. No private key material is present.
# The identity password hash is random per template build; that login is a
# fallback only - the Hermes key is the primary and CI-facing login, and
# PasswordAuthentication is disabled by the late commands.

autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: UTC
  # --- Network: static br0 IP (matches vms.py and CI wiring) ---
  network:
    version: 2
    ethernets:
      eth0:
        dhcp4: false
        addresses:
          - 192.168.1.168/24
        routes:
          - to: default
            via: 192.168.1.1
        nameservers:
          addresses: [192.168.1.1, 1.1.1.1]
  # --- SSH: install server, authorize ONLY the workforce key, no passwords ---
  # Schema-supported path for key authorization (identity.ssh_key is NOT a
  # valid autoinstall key). The driver replaces the placeholder in the
  # ssh.authorized-keys list with the workforce public key.
  ssh:
    install-server: true
    authorized-keys:
      - "PLACEHOLDER_WORKFORCE_KEY"
    allow-pw: false
  # --- Identity: non-root user (root is reserved and rejected by Subiquity),
  # password is a valid SHA-512 crypt string (the "!" literal failed schema);
  # direct root login over SSH is authorized later via the late commands.
  identity:
    realname: ubuntu2604 ci
    hostname: ubuntu2604
    username: ci
    password: "$6$XxwNbscFnWk$IAs.DbN5mIJFag6umugBvMG7p3GLwFhc3rKHgTrynRjtNcQwi2yt5h1c7EzVOeH.4.EWWvpQ9nZBKjpakhS6O."
  # --- Storage: entire disk vda (the qcow2), plain direct layout ---
  storage:
    layout:
      name: direct
  # --- Packages: guest agent + certs (openssh-server comes via ssh.install-server) ---
  packages:
    - qemu-guest-agent
    - ca-certificates
  # --- Late commands: run via curtin in-target so they apply to the INSTALLED
  # --- system at /target, not the live session (job 57074 mistake). The
  # --- completion marker is written to /dev/ttyS0 so the console driver sees
  # --- it on the serial line it is actually watching.
  late-commands:
    - curtin in-target -- bash -c 'systemctl enable serial-getty@ttyS0.service'
    # Authorize root SSH with the SAME workforce key the ssh: section gives
    # the ci user. The driver injects the key into every PLACEHOLDER occurrence,
    # so this does not depend on subiquity's user-file layout. Root is the user
    # the repo VM stages connect as (VM_SSH_USER default root).
    - curtin in-target -- bash -c 'mkdir -p /root/.ssh && chmod 700 /root/.ssh'
    - curtin in-target -- bash -c 'echo "PLACEHOLDER_WORKFORCE_KEY" > /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys'
    - curtin in-target -- bash -c 'sed -i "s/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/" /etc/ssh/sshd_config'
    - curtin in-target -- bash -c 'sed -i "s/^#\?PasswordAuthentication.*/PasswordAuthentication no/" /etc/ssh/sshd_config'
    - curtin in-target -- bash -c 'systemctl enable ssh.service'
    - curtin in-target -- bash -c 'systemctl enable qemu-guest-agent.service'
    - bash -c 'echo AUTOINSTALL_LATE_COMMAND_DONE > /dev/ttyS0; echo AUTOINSTALL_LATE_COMMAND_DONE'
