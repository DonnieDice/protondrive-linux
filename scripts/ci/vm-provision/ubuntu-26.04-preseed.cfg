# scripts/ci/vm-provision/ubuntu-26.04-preseed.cfg
#
# Preseed for the Ubuntu 26.04 server (d-i / netboot) headless install into
# the ubuntu-26.04 guest on the tower hypervisor (issue #20, parent #8).
#
# Loaded by the debian-installer via preseed/url=... on the kernel cmdline
# (see ubuntu-26.04-install.sh and ubuntu-26.04-console.tcl). The URL points
# to the preseed served by busybox httpd on the tower host.
#
# Target spec (issue #20 acceptance criteria):
#   - Ubuntu 26.04 installed to the ubuntu-26.04 guest's qcow2 disk
#   - static 192.168.1.168/24 on br0 (tests/robot/vars/vms.py ubuntu-26.04)
#   - sshd enabled and running
#   - qemu-guest-agent installed and enabled
#   - the Hermes (workforce) public key as sole root login (password locked,
#     PermitRootLogin prohibit-password)
#   - serial console getty for headless maintenance
#
# The public half of the workforce key is appended by the driver right before
# serving (d-i passwd/root-sshkey preseed); no private material is present.

# --- Console: serial console so the expect driver sees the installer ---
d-i debian-installer/early-debug boolean true
d-i debian-installer/console-setup/ask_detect boolean false
d-i debian-installer/console-setup/layoutcode string us
d-i console-setup/trytty boolean false
d-i console-setup/modelcode string pc105
d-i console-setup/optionscode string 'console=ttyS0,115200n8'

# --- Locale & timezone ---
d-i locale string en_US.UTF-8
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string 192.168.1.1

# --- Network: static br0 IP (matches vms.py and CI wiring) ---
# The netcfg preseed configures the installer's network; the installed system
# gets the same static config via the networkd/legacy config below.
d-i netcfg/choose_interface string auto
d-i netcfg/get_hostname string ubuntu-2604
d-i netcfg/get_domain string local
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/dhcp_options select: 192.168.1.168
d-i netcfg/get_ipaddress string 192.168.1.168
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 192.168.1.1
d-i netcfg/get_nameservers string 192.168.1.1 1.1.1.1
d-i netcfg/get_dns_searchlist string local

# --- Mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# --- Storage: entire disk vda (the qcow2), no LVM, no swap ---
# The transient domain attaches ONLY the ubuntu-26.04 qcow2, so vda is
# unambiguous; clearpart wipes only that disk.
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false

# --- Account setup: root password locked, workforce key only ---
# The public half of the workforce key is appended by the driver below.
d-i passwd/root-login boolean false
d-i passwd/root-password-crypted password !
d-i passwd/make-user boolean false
d-i passwd/user-fullname string Operator
d-i passwd/user-password-crypted password !
d-i passwd/user-uid string

# --- Packages to install ---
# openssh-server: SSH access
# qemu-guest-agent: virsh guest-ping + guest-exec channel
# ca-certificates: TLS for apt
d-i pkgsel/include string openssh-server qemu-guest-agent ca-certificates
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select none
d-i pkgsel/language-packs multiselect

# --- Late command: serial console, sshd config, qemu-guest-agent enable ---
d-i preseed/late_command string \
    in-target systemctl enable qemu-guest-agent.service; \
    in-target systemctl enable ssh.service; \
    in-target sed -i 's/^#\{0,1\}PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config; \
    in-target sed -i 's/^#\{0,1\}PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config; \
    in-target systemctl enable serial-getty@ttyS0.service; \
    echo "PRESEED_LATE_COMMAND_DONE"
