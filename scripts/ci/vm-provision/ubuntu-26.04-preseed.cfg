#cloud-config
# scripts/ci/vm-provision/ubuntu-26.04-preseed.cfg
#
# Subiquity autoinstall user-data for the Ubuntu 26.04 headless install into
# the ubuntu2604 guest on the tower hypervisor (issue #20, parent #8).
#
# Loaded by the Subiquity installer via the kernel cmdline:
#   autoinstall url=http://192.168.1.31:<port>/user-data
# (see ubuntu-26.04-install.sh and ubuntu-26.04-console.tcl).
#
# Target spec (issue #20 acceptance criteria):
#   - Ubuntu 26.04 installed to the ubuntu2604 guest's qcow2 disk
#   - static 192.168.1.168/24 on br0 (tests/robot/vars/vms.py ubuntu-26.04)
#   - sshd enabled and running
#   - qemu-guest-agent installed and enabled
#   - the Hermes (workforce) public key as sole root login (password locked,
#     PermitRootLogin prohibit-password)
#   - serial console getty for headless maintenance
#
# The public half of the workforce key is injected by the driver (install.sh)
# into the identity.ssh_key field before serving. The driver uses awk to
# replace the empty placeholder below. No private key material is present.

# cloud-config header: this is both cloud-init user-data and Subiquity autoinstall.
# The autoinstall key tells Subiquity to use this config directly.
# Network config is embedded in the autoinstall.network block (Subiquity v2
# autoinstall schema). Static IP 192.168.1.168/24 on br0 matching vms.py.
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: UTC
  # --- Network: static br0 IP (matches vms.py and CI wiring) ---
  network:
    version: 2
    ethernets:
      eth0:
        dhcp4: false
        addresses:
          - 192.168.1.168/24
        routes:
          - to: default
            via: 192.168.1.1
        nameservers:
          addresses: [192.168.1.1, 1.1.1.1]
  # --- Identity: root with password locked, workforce key as sole login ---
  # The driver injects the workforce public key here by replacing the
  # empty ssh_key placeholder.
  identity:
    hostname: ubuntu2604
    password: "!"
    username: root
    ssh_key: ""
  # --- Storage: entire disk vda (the qcow2), GPT, single ext4 root + ESP ---
  # The transient domain attaches ONLY the ubuntu2604 qcow2, so vda is
  # unambiguous; wipe and partition it.
  storage:
    config:
      - type: disk
        id: disk0
        ptable: gpt
        devices:
          - vda
        consumers:
          - partition:vfat:esp
          - partition:ext4:root
        pttype: gpt
        flags:
          - boot
    filesystems:
      - label: root
        type: ext4
        id: root-fs
  # --- Packages: sshd + qemu-guest-agent + ca-certificates ---
  packages:
    - openssh-server
    - qemu-guest-agent
    - ca-certificates
  # --- Late commands: enable services, serial console, sshd config ---
  late-commands:
    - |
      #!/bin/bash
      # Enable serial console getty for headless maintenance
      systemctl enable serial-getty@ttyS0.service
      # Configure sshd: key-only root login
      sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
      sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
      systemctl enable ssh.service
      systemctl enable qemu-guest-agent.service
      echo "AUTOINSTALL_LATE_COMMAND_DONE"
