# scripts/ci/vm-provision/fedora-43-kickstart.cfg
#
# Kickstart for the Fedora 43 headless install into the fedora-43 guest
# on the tower hypervisor (issue #18, parent #12).
#
# Served to the installer over the LAN from the tower host (see
# fedora-43-install.sh); fetched by the transient fedora-43-install domain's
# kernel cmdline as inst.ks=http://192.168.1.31:<port>/fedora43-ks.cfg
# (Fedora 43 Live ISOs use livesys, which checks for inst.ks= to launch
#  Anaconda in text mode over serial — the ks= and textinst legacy
#  parameters are not recognized by the F43 live initrd and cause the
#  system to boot into the live environment instead of the installer).
#
# Target spec (issue #18 acceptance criteria):
#   - Fedora 43 installed to the fedora-43 guest's qcow2 disk (created by
#     the driver when absent; never overwriting an existing OS)
#   - static 192.168.1.183/24 on br0 (tests/robot/vars/vms.py fedora-43 entry)
#   - sshd enabled and running
#   - qemu-guest-agent installed and enabled (the domain XML carries the
#     org.qemu.guest_agent.0 unix channel)
#   - the Hermes (workforce) public key as the sole root login method
#     (root password locked, PermitRootLogin prohibit-password)
#   - Fedora 43 standard repos + updates repo enabled at install time
#
# Fedora 43 supports UEFI; the persistent domain will be redefined with OVMF
# firmware to match the UEFI boot requirement.
#
# The public half of the workforce key is appended by the driver right before
# serving (sshkey kickstart directive below); no private material is present.

# language / keyboard / timezone
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone UTC --utc

# install (not upgrade) to the first virtio disk, wiping only that disk
reboot --eject
zerombr
clearpart --all --initlabel --drives=vda
autopart --type=plain

# minimal-but-usable server: standard environment + system tools; no desktop
%packages
@core
@standard
qemu-guest-agent
openssh-server
openssh-clients
tar
gzip
curl
%end

# network: static br0 address, hostname matches CI wiring (fedora-43)
network --bootproto=static --device=link --ip=192.168.1.183 --netmask=255.255.255.0 --gateway=192.168.1.1 --nameserver=192.168.1.1 --hostname=fedora-43 --activate

# root login: locked password, workforce key only (driver appends the key line)
rootpw --lock
%post --erroronfail
# workforce key lands via the driver-templated sshkey line; ensure sshd config
sed -i 's/^#\{0,1\}PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
systemctl enable sshd.service
systemctl enable qemu-guest-agent.service
# serial console getty for headless maintenance (matches domain XML console)
systemctl enable --now serial-getty@ttyS0.service 2>/dev/null || true
%end
