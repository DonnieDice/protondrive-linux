# scripts/ci/vm-provision/el10-kickstart.cfg
#
# Kickstart for the CentOS Stream 10 headless install into the existing el10
# guest on the tower hypervisor (issue #19, parent #11).
#
# Served to the installer over the LAN from the tower host (see
# el10-install.sh); fetched by the transient el10-install domain's kernel
# cmdline as inst.ks=http://192.168.1.31:<port>/el10-ks.cfg.
#
# Target spec (issue #19 acceptance criteria):
#   - CentOS Stream 10 installed to the el10 guest's qcow2 disk (created by
#     the driver when absent; never overwriting an existing OS)
#   - static 192.168.1.123/24 on br0 (tests/robot/vars/vms.py el10 entry)
#   - sshd enabled and running
#   - qemu-guest-agent installed and enabled (the domain XML already carries
#     the org.qemu.guest_agent.0 unix channel)
#   - the Hermes (workforce) public key as the sole root login method
#     (root password locked, PermitRootLogin prohibit-password)
#   - EPEL + CRB enabled at install time (the el10 CI install stage expects
#     them for webkit2gtk4.1 / libayatana-appindicator-gtk3 deps)
#
# EL10 is UEFI-only (Legacy BIOS boot removed upstream; the DVD carries no
# isolinux/ tree): the bootloader installs grub2-efi to the EFI System
# Partition that autopart creates, and both domains run OVMF firmware.
#
# The public half of the workforce key is appended by the driver right before
# serving (sshkey kickstart directive below); no private material is present.

# language / keyboard / timezone
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone UTC --utc

# install (not upgrade) to the first virtio disk, wiping only that disk
# (the transient domain attaches ONLY the el10 qcow2, so vda is unambiguous)
reboot --eject
bootloader --timeout=1
zerombr
clearpart --all --initlabel --drives=vda
autopart --type=plain

# minimal-but-usable server: base + system tools; no desktop
%packages
@core
@standard
qemu-guest-agent
openssh-server
openssh-clients
tar
gzip
curl
%end

# network: static br0 address, hostname matches CI wiring (el10)
network --bootproto=static --device=link --ip=192.168.1.123 --netmask=255.255.255.0 --gateway=192.168.1.1 --nameserver=192.168.1.1 --hostname=el10 --activate
# EPEL + CRB: required by the el10 install stage for webkit2gtk4.1 and
# libayatana-appindicator-gtk3 (see scripts/ci/install/el10/install.sh note)
repo --name=epel --install --baseurl=https://dl.fedoraproject.org/pub/epel/10/everything/x86_64/
repo --name=crb --install --baseurl=https://mirror.stream.centos.org/10-stream/CRB/x86_64/os/

# root login: locked password, workforce key only (driver appends the key line)
rootpw --lock
%post --erroronfail
# workforce key lands via the driver-templated sshkey line; ensure sshd config
sed -i 's/^#\{0,1\}PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
systemctl enable sshd.service
systemctl enable qemu-guest-agent.service
# serial console getty for headless maintenance (matches domain XML console)
systemctl enable --now serial-getty@ttyS0.service 2>/dev/null || true
%end
