# ─── Shared Rust CI cache ─────────────────────────────────────────────────────
# test:fmt, test:clippy and test:rust previously used separate CARGO_HOME
# directories (.cargo-fmt, .cargo-clippy, .cargo-test), so every job
# downloaded and installed its own full Rust toolchain plus registry, and
# clippy/rust fought over src-tauri/target/ under different cache keys
# (fingerprint mismatch → full Tauri rebuild per job). Clippy ran 65 minutes
# and hit job_execution_timeout; fmt blew its 10m budget on toolchain setup.
# One shared toolchain+registry+target cache keyed on Cargo.lock fixes the
# cold/warm behavior for all three. First run after this change is cold by
# design; the raised timeouts below cover it.

.rust-ci-cache:
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-ci"
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
      prefix: rust-ci-v1
    paths:
      - .cargo-ci/
      - src-tauri/target/
    when: always

# ─── Test: Python Unit Tests ──────────────────────────────────────────────────
# Runs the pytest unit suite under tests/unit/ on Python 3.12. Catches drift in
# the VM matrix, artifact-keying helpers, CI deploy lib (_common.sh), doc-audit
# path resolver, AI-doc patch applier, and the WebClients build/patch scripts
# (fix_deps.py, create_stubs.py, patch_drive_linux_*.py).
# Bash-script subprocess tests skip on Windows (handled by conftest); on Linux
# CI all 158 tests run.

test:pytest:
  extends: .rules:test
  stage: test
  image: python:3.12-slim
  timeout: 20m
  dependencies: []
  variables:
    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.pip-cache"
  cache:
    key: test-pytest-pip-v1
    paths:
      - .pip-cache/
    when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq bash openssh-client git
    - python -m pip install -r tests/requirements.txt
  script:
    - python -m pytest tests/unit/ -q --no-header --junitxml=reports/pytest.xml
    - mkdir -p public/pytest || true
    - cp reports/pytest.xml public/pytest/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - reports/pytest.xml
    reports:
      junit: reports/pytest.xml
    expire_in: 14 days

# ─── Test: Rust Format Check ──────────────────────────────────────────────────

test:fmt:
  extends:
    - .rules:test
    - .rust-ci-cache
  stage: test
  image: debian:12
  timeout: 20m
  dependencies: []
  before_script:
    - apt-get update && apt-get install -y bash curl
    - source scripts/ci/lib/install-rust.sh
    - rustup component add rustfmt
  script:
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

# ─── Test: Rust Clippy Lints ──────────────────────────────────────────────────

test:clippy:
  extends:
    - .rules:test
    - .rust-ci-cache
  stage: test
  image: debian:12
  timeout: 90m
  dependencies: []
  before_script:
    - apt-get update && apt-get install -y bash curl build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
        librsvg2-dev libsoup-3.0-dev
    - source scripts/ci/lib/install-rust.sh
    - rustup component add clippy
  script:
    - mkdir -p WebClients/applications/drive/dist
    - |
      printf '<!doctype html><html><body>rust clippy fixture</body></html>\n' \
        > WebClients/applications/drive/dist/index.html
    - cargo clippy --manifest-path src-tauri/Cargo.toml -- -D clippy::all -W clippy::pedantic

# ─── Test: Rust Unit Tests ────────────────────────────────────────────────────

test:rust:
  extends:
    - .rules:test
    - .rust-ci-cache
  stage: test
  image: debian:12
  timeout: 90m
  dependencies: []
  before_script:
    - apt-get update && apt-get install -y bash curl git wget build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
        librsvg2-dev libsoup-3.0-dev
    - source scripts/ci/lib/install-rust.sh
  script:
    - mkdir -p WebClients/applications/drive/dist
    - |
      printf '<!doctype html><html><body>rust test fixture</body></html>\n' \
        > WebClients/applications/drive/dist/index.html
    - cargo test --manifest-path src-tauri/Cargo.toml --locked -- --nocapture
