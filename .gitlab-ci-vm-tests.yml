{:value=>"# VM integration tests for the Unraid-hosted GitLab runner.\n# The runner mounts /mnt/user/appdata/gitlab-runner/ssh into each Docker job\n# as /root/.ssh:ro, so these jobs can use SSH aliases from that config.\n#\n# VMs available in SSH config:\n#   debian12 (192.168.1.162), debian13 (192.168.1.120),\n#   alpine320 (192.168.1.157), alpine322 (192.168.1.126),\n#   arch (192.168.1.128), ubuntu2404 (192.168.1.219),\n#   ubuntu2604 (192.168.1.168)\n\nvm:ssh:smoke:\n  stage: smoke\n  image: alpine:latest\n  timeout: 5m\n  dependencies: []\n  parallel:\n    matrix:\n      - VM_HOST:\n          - tower\n          - debian12\n          - alpine320\n          - alpine322\n          - arch\n          - ubuntu2604\n  before_script:\n    - apk add --no-cache openssh-client\n  script:\n    - test -r /root/.ssh/id_ed25519\n    - test -r /root/.ssh/config\n    - ssh -o BatchMode=yes -o ConnectTimeout=10 \"$VM_HOST\" \"echo vm-smoke-ok:\\$(hostname):\\$(whoami)\"\n  rules:\n    - when: manual\n      allow_failure: true\n\n.install_test:\n  stage: smoke\n  image: alpine:latest\n  timeout: 20m\n  allow_failure: true\n  before_script:\n    - apk add --no-cache openssh-client rsync bash\n  script:\n    - cd artifacts || { echo \"No artifacts\"; exit 1; }\n    - pkg=\"$(find . -type f \\( -name '*.deb' -o -name '*.apk.tar.gz' -o -name '*.pkg.tar.zst' -o -name '*.rpm' -o -name '*.AppImage' \\) -print -quit)\"\n    - test -n \"$pkg\" || { echo \"No installable package found in downloaded artifacts\"; exit 1; }\n    - echo \"Transferring $pkg to $VM_HOST...\"\n    - scp -o BatchMode=yes \"$pkg\" \"$VM_HOST:/tmp/\"\n    - pkg_name=\"$(basename \"$pkg\")\"\n    - |\n      case \"$INSTALL_TYPE\" in\n        deb)\n          ssh -o BatchMode=yes \"$VM_HOST\" \"apt-get update -qq && apt-get install -y -qq /tmp/$pkg_name && dpkg -L proton-drive 2>/dev/null | grep bin/$PROG_NAME && $PROG_NAME --version 2>/dev/null || echo binary-installed\"\n          ;;\n        apk)\n          ssh -o BatchMode=yes \"$VM_HOST\" \"cd /tmp && tar xzf $pkg_name && mkdir -p /usr/local/bin && cp usr/bin/$PROG_NAME /usr/local/bin/ && $PROG_NAME --version 2>/dev/null || echo binary-installed\"\n          ;;\n        arch)\n          ssh -o BatchMode=yes \"$VM_HOST\" \"pacman -U --noconfirm /tmp/$pkg_name && $PROG_NAME --version 2>/dev/null || echo binary-installed\"\n          ;;\n        *)\n          echo \"Unknown INSTALL_TYPE=$INSTALL_TYPE\"\n          exit 1\n          ;;\n      esac\n    - echo \"Install test on $VM_HOST completed\"\n  rules:\n    - if: '$CI_COMMIT_BRANCH == \"main\"'\n      when: on_success\n    - when: manual\n      allow_failure: true\n\nvm:install:debian12:\n  extends: .install_test\n  needs:\n    - job: build:deb:debian-12\n      artifacts: true\n  variables:\n    VM_HOST: debian12\n    INSTALL_TYPE: deb\n    PROG_NAME: proton-drive\n\nvm:install:alpine320:\n  extends: .install_test\n  needs:\n    - job: build:apk:alpine-3.20\n      artifacts: true\n  variables:\n    VM_HOST: alpine320\n    INSTALL_TYPE: apk\n    PROG_NAME: proton-drive\n\nvm:install:alpine322:\n  extends: .install_test\n  needs:\n    - job: build:apk:alpine-3.22\n      artifacts: true\n  variables:\n    VM_HOST: alpine322\n    INSTALL_TYPE: apk\n    PROG_NAME: proton-drive\n\nvm:install:arch:\n  extends: .install_test\n  needs:\n    - job: build:aur\n      artifacts: true\n  variables:\n    VM_HOST: arch\n    INSTALL_TYPE: arch\n    PROG_NAME: proton-drive\n\nvm:install:ubuntu2604:\n  extends: .install_test\n  needs:\n    - job: build:deb:ubuntu-26.04\n      artifacts: true\n  variables:\n    VM_HOST: ubuntu2604\n    INSTALL_TYPE: deb\n    PROG_NAME: proton-drive\n\n.vm_regression:\n  stage: smoke\n  image: alpine:latest\n  timeout: 15m\n  allow_failure: true\n  before_script:\n    - apk add --no-cache openssh-client bash\n  script:\n    - echo \"Running regression tests on $VM_HOST...\"\n    - ssh -o BatchMode=yes \"$VM_HOST\" \"which proton-drive || which /usr/local/bin/proton-drive\" || { echo \"proton-drive not installed on $VM_HOST\"; exit 1; }\n    - for f in tests/regression/*.sh; do bash \"$f\"; done\n    - echo \"Regression tests on $VM_HOST completed\"\n  rules:\n    - if: '$CI_COMMIT_BRANCH == \"main\"'\n      when: on_success\n    - when: manual\n      allow_failure: true\n\nvm:regression:debian12:\n  extends: .vm_regression\n  variables:\n    VM_HOST: debian12\n  needs:\n    - job: vm:install:debian12\n\nvm:regression:alpine320:\n  extends: .vm_regression\n  variables:\n    VM_HOST: alpine320\n  needs:\n    - job: vm:install:alpine320\n\nvm:regression:ubuntu2604:\n  extends: .vm_regression\n  variables:\n    VM_HOST: ubuntu2604\n  needs:\n    - job: vm:install:ubuntu2604\n\nvm:ssh:diagnostics:\n  stage: smoke\n  image: alpine:latest\n  timeout: 5m\n  dependencies: []\n  before_script:\n    - apk add --no-cache openssh-client\n  script:\n    - ssh -V\n    - ls -la /root/.ssh\n    - for h in tower debian12 alpine320 alpine322 arch ubuntu2604; do echo \"--- $h ---\"; ssh -o BatchMode=yes -o ConnectTimeout=5 \"$h\" \"hostname; whoami\" || true; done\n  rules:\n    - when: manual\n      allow_failure: true\n", :PSPath=>"C:\\Users\\Joey\\Documents\\Projects\\proton\\protondrive\\.gitlab-ci-vm-tests.yml", :PSParentPath=>"C:\\Users\\Joey\\Documents\\Projects\\proton\\protondrive", :PSChildName=>".gitlab-ci-vm-tests.yml", :PSDrive=>{:CurrentLocation=>"Users\\Joey\\Documents\\Projects\\proton\\protondrive", :Name=>"C", :Provider=>{:ImplementingType=>{:Module=>"System.Management.Automation.dll", :Assembly=>"System.Management.Automation, Version=3.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35", :TypeHandle=>"System.RuntimeTypeHandle", :DeclaringMethod=>nil, :BaseType=>"System.Management.Automation.Provider.NavigationCmdletProvider", :UnderlyingSystemType=>"Microsoft.PowerShell.Commands.FileSystemProvider", :FullName=>"Microsoft.PowerShell.Commands.FileSystemProvider", :AssemblyQualifiedName=>"Microsoft.PowerShell.Commands.Fi