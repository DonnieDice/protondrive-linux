# VM integration tests for the Unraid-hosted GitLab runner.
# The runner mounts /mnt/user/appdata/gitlab-runner/ssh into each Docker job
# as /root/.ssh:ro, so these jobs can use SSH aliases from that config.
#
# VMs available in SSH config:
#   debian12 (192.168.1.162), debian13 (192.168.1.120),
#   alpine320 (192.168.1.157), alpine322 (192.168.1.126),
#   arch (192.168.1.128), ubuntu2404 (192.168.1.219),
#   ubuntu2604 (192.168.1.168)

vm:ssh:smoke:
  stage: smoke
  image: alpine:latest
  timeout: 5m
  dependencies: []
  parallel:
    matrix:
      - VM_HOST:
          - tower
          - debian12
          - alpine320
          - alpine322
          - arch
          - ubuntu2604
  before_script:
    - apk add --no-cache openssh-client
    - export VM_KNOWN_HOSTS="$CI_PROJECT_DIR/.vm-known-hosts"
    - ': > "$VM_KNOWN_HOSTS"'
  script:
    - test -r /root/.ssh/id_ed25519
    - test -r /root/.ssh/config
    - ssh -o BatchMode=yes -o ConnectTimeout=10 -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o StrictHostKeyChecking=accept-new "$VM_HOST" "echo vm-smoke-ok:\$(hostname):\$(whoami)"
  rules:
    - when: manual
      allow_failure: true

.install_test:
  stage: smoke
  image: alpine:latest
  timeout: 20m
  allow_failure: false
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - export VM_KNOWN_HOSTS="$CI_PROJECT_DIR/.vm-known-hosts"
    - ': > "$VM_KNOWN_HOSTS"'
  script:
    - cd artifacts || { echo "No artifacts"; exit 1; }
    - pkg="$(find . -type f \( -name '*.deb' -o -name '*.apk.tar.gz' -o -name '*.pkg.tar.zst' -o -name '*.rpm' -o -name '*.AppImage' \) -print -quit)"
    - test -n "$pkg" || { echo "No installable package found in downloaded artifacts"; exit 1; }
    - echo "Transferring $pkg to $VM_HOST..."
    - scp -o BatchMode=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o StrictHostKeyChecking=accept-new "$pkg" "$VM_HOST:/tmp/"
    - pkg_name="$(basename "$pkg")"
    - |
      case "$INSTALL_TYPE" in
        deb)
          ssh -o BatchMode=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o StrictHostKeyChecking=accept-new "$VM_HOST" "apt-get update -qq && apt-get install -y -qq /tmp/$pkg_name && dpkg -L proton-drive 2>/dev/null | grep bin/$PROG_NAME && $PROG_NAME --version 2>/dev/null || echo binary-installed"
          ;;
        apk)
          ssh -o BatchMode=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o StrictHostKeyChecking=accept-new "$VM_HOST" "cd /tmp && tar xzf $pkg_name && mkdir -p /usr/local/bin && cp usr/bin/$PROG_NAME /usr/local/bin/ && $PROG_NAME --version 2>/dev/null || echo binary-installed"
          ;;
        arch)
          ssh -o BatchMode=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o StrictHostKeyChecking=accept-new "$VM_HOST" "pacman -U --noconfirm /tmp/$pkg_name && $PROG_NAME --version 2>/dev/null || echo binary-installed"
          ;;
        *)
          echo "Unknown INSTALL_TYPE=$INSTALL_TYPE"
          exit 1
          ;;
      esac
    - echo "Install test on $VM_HOST completed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: manual
      allow_failure: true

vm:install:debian12:
  extends: .install_test
  dependencies:
    - build:deb:debian-12
  variables:
    VM_HOST: debian12
    INSTALL_TYPE: deb
    PROG_NAME: proton-drive

vm:install:alpine320:
  extends: .install_test
  dependencies:
    - build:apk:alpine-3.20
  variables:
    VM_HOST: alpine320
    INSTALL_TYPE: apk
    PROG_NAME: proton-drive

vm:install:alpine322:
  extends: .install_test
  dependencies:
    - build:apk:alpine-3.22
  variables:
    VM_HOST: alpine322
    INSTALL_TYPE: apk
    PROG_NAME: proton-drive

vm:install:arch:
  extends: .install_test
  dependencies:
    - build:aur
  variables:
    VM_HOST: arch
    INSTALL_TYPE: arch
    PROG_NAME: proton-drive

vm:install:ubuntu2604:
  extends: .install_test
  dependencies:
    - build:deb:ubuntu-26.04
  variables:
    VM_HOST: ubuntu2604
    INSTALL_TYPE: deb
    PROG_NAME: proton-drive

.vm_regression:
  stage: smoke
  image: alpine:latest
  timeout: 45m
  allow_failure: false
  variables:
    RUN_VM_LOGIN_TESTS: "true"
  before_script:
    - apk add --no-cache openssh-client bash coreutils
    - export VM_SSH_KEY="${VM_SSH_KEY:-/root/.ssh/id_ed25519}"
    - export VM_KNOWN_HOSTS="$CI_PROJECT_DIR/.vm-known-hosts"
    - ': > "$VM_KNOWN_HOSTS"'
  script:
    - echo "Running regression tests on $VM_HOST..."
    - ssh -o BatchMode=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o StrictHostKeyChecking=accept-new "$VM_HOST" "which proton-drive || which /usr/local/bin/proton-drive" || { echo "proton-drive not installed on $VM_HOST"; exit 1; }
    - bash "$VM_TEST_SCRIPT"
    - echo "Regression tests on $VM_HOST completed"
  artifacts:
    when: always
    paths:
      - test-results/
      - verify-results/ui-screenshots/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: manual
      allow_failure: true

vm:regression:debian12:
  extends: .vm_regression
  variables:
    VM_HOST: debian12
    VM_TEST_SCRIPT: scripts/ci/vmtest/debian-12/test.sh
  needs:
    - job: vm:install:debian12

vm:regression:alpine320:
  extends: .vm_regression
  variables:
    VM_HOST: alpine320
    VM_TEST_SCRIPT: scripts/ci/vmtest/alpine-3.20/test.sh
  needs:
    - job: vm:install:alpine320

vm:regression:alpine322:
  extends: .vm_regression
  variables:
    VM_HOST: alpine322
    VM_TEST_SCRIPT: scripts/ci/vmtest/alpine-3.22/test.sh
  needs:
    - job: vm:install:alpine322

vm:regression:arch:
  extends: .vm_regression
  variables:
    VM_HOST: arch
    VM_TEST_SCRIPT: scripts/ci/vmtest/arch/test.sh
  needs:
    - job: vm:install:arch

vm:regression:ubuntu2604:
  extends: .vm_regression
  variables:
    VM_HOST: ubuntu2604
    VM_TEST_SCRIPT: scripts/ci/vmtest/ubuntu-26.04/test.sh
  needs:
    - job: vm:install:ubuntu2604

vm:provision:build-deps:
  stage: smoke
  image: alpine:latest
  # Pin to the unraid-docker-runner: it bind-mounts /root/.ssh (transport for
  # the mounted mode in _vm_common.sh). Observed in pipeline 2113: untagged
  # smoke jobs raced onto k8s-runner, which has no /root/.ssh, and failed with
  # "no SSH transport available" (jobs 22992/22993).
  tags: [android]
  # Observed on this runner (2026-09-27, pipelines 2098/2099): image pulls and
  # apk fetches each take minutes, apt on the VMs is slow, and the full
  # provision + WebClients + cargo release build sequence is long. 3h fits the
  # whole sequence with headroom; the job remains manual.
  timeout: 3h
  # Opt out of stage ordering: this manual job must be playable immediately in
  # any pipeline (parent #3 / issue #14 need it before the full test suite
  # settles). Without needs: [] it stays "created"/unplayable until every
  # earlier stage finishes, which blocks VM provisioning on unrelated
  # test-stage flakiness.
  needs: []
  dependencies: []
  before_script:
    - apk add --no-cache openssh-client bash git curl
  script:
    - bash scripts/ci/vm-provision/build-deps.sh
  rules:
    - when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success

# Issue #14: authorized debian13 guest-start job. The tower inventory (job
# 24251, pipeline 2138) proved every guest shut off — the root cause of the
# pipeline 2129 "Host is unreachable" failures. Issue #14 scope item 2
# authorizes starting the debian13 guest via the tower transport. Exactly one
# lifecycle action on exactly one guest; state evidence is recorded before and
# after. Manual + allow_failure so it never blocks the release-policy jobs.
vm:guest-start:debian13:
  stage: smoke
  image: alpine:latest
  tags: [android]
  timeout: 15m
  needs: []
  dependencies: []
  before_script:
    - apk add --no-cache openssh-client bash
    - export VM_KNOWN_HOSTS="$CI_PROJECT_DIR/.vm-known-hosts"
    - ': > "$VM_KNOWN_HOSTS"'
  script:
    - bash scripts/ci/vm-provision/guest-start-debian13.sh
  artifacts:
    when: always
    paths:
      - guest-start-results/
    expire_in: 30 days
  rules:
    - when: manual
      allow_failure: true

vm:verify:rust-toolchain:
  stage: smoke
  image: alpine:latest
  # Same runner pin as vm:provision:build-deps (mounted /root/.ssh transport).
  tags: [android]
  # Same slow-runner observation: VM round-trips plus rustup/rustc/cargo
  # version checks need more than the original 10m headroom.
  timeout: 20m
  # Same opt-out: immediately playable manual job that verifies (without
  # modifying) the rustup default toolchain and the protondrive-linux release
  # binary on debian13 and debian12. Read-only evidence for issue #14.
  needs: []
  dependencies: []
  before_script:
    - apk add --no-cache openssh-client bash
  script:
    - bash scripts/ci/vm-provision/verify-toolchain.sh 192.168.1.120 debian13
    - bash scripts/ci/vm-provision/verify-toolchain.sh 192.168.1.162 debian12
  rules:
    - when: manual
      allow_failure: true

# Issue #14: read-only storage inspection diagnosing the debian13
# "disk path not accessible" failure from vm:guest-start:debian13
# (job 24760). No mutation: ls/find/df/virsh queries only. Manual +
# allow_failure so it never blocks the release-policy jobs.
vm:inspect:debian13-storage:
  stage: smoke
  image: alpine:latest
  tags: [android]
  timeout: 15m
  needs: []
  dependencies: []
  before_script:
    - apk add --no-cache openssh-client bash
  script:
    - bash scripts/ci/vm-provision/inspect-debian13-storage.sh
  artifacts:
    when: always
    paths:
      - inspect-results/
    expire_in: 30 days
  rules:
    - when: manual
      allow_failure: true

# Issue #14: authorized debian13/debian12 domain-disk repair + start. The
# domains share was migrated off pool_two (Sep 27 22:19); both guests' XML
# still points at /mnt/pool_two/domains/<guest>/vdisk1.qcow2 which no longer
# exists, so virsh start fails (job 24760: "Path ... is not accessible").
# The real disks live at /mnt/user/domains/<guest>/vdisk1.qcow2 (inspection
# job 25655). This job repairs exactly that one path per guest (XML backup
# kept on the tower), starts both guests, and polls SSH reachability.
# debian12 is included only because the shared vm:provision:build-deps job
# (scope item 1) provisions both hosts. Manual + allow_failure so it never
# blocks the release-policy jobs.
vm:repair:vm-domain-disk:
  stage: smoke
  image: alpine:latest
  tags: [android]
  timeout: 45m
  needs: []
  dependencies: []
  before_script:
    - apk add --no-cache openssh-client bash
  script:
    - bash scripts/ci/vm-provision/repair-vm-domain-disk.sh
  artifacts:
    when: always
    paths:
      - repair-results/
    expire_in: 30 days
  rules:
    - when: manual
      allow_failure: true

vm:ssh:diagnostics:
  stage: smoke
  image: alpine:latest
  timeout: 5m
  dependencies: []
  before_script:
    - apk add --no-cache openssh-client
    - export VM_KNOWN_HOSTS="$CI_PROJECT_DIR/.vm-known-hosts"
    - ': > "$VM_KNOWN_HOSTS"'
  script:
    - ssh -V
    - ls -la /root/.ssh
    - for h in tower debian12 alpine320 alpine322 arch ubuntu2604; do echo "--- $h ---"; ssh -o BatchMode=yes -o ConnectTimeout=5 -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o StrictHostKeyChecking=accept-new "$h" "hostname; whoami" || true; done
  rules:
    - when: manual
      allow_failure: true
